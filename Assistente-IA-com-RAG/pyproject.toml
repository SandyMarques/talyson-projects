[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-assistant"
version = "1.0.0"
description = "Assistente IA inteligente com RAG (Retrieval-Augmented Generation), FastAPI, LangChain, ChromaDB e OpenAI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.7",
    "langchain-chroma>=0.1.1",
    "chromadb>=0.5.0",
    "tiktoken>=0.7.0",
    "pypdf>=4.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
