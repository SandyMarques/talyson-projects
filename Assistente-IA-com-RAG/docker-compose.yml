services:
  rag-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_assistant_app
    ports:
      - "8000:8000"
    # Todas as configurações (provedor de LLM, chaves, API_KEY, CORS...) vêm do .env,
    # criado a partir do .env.example. Só os caminhos internos do container são fixados aqui.
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - ./data/chroma:/app/data/chroma
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped
